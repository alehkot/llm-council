[project]
name = "llm-council"
version = "0.1.0"
description = "Your LLM Council"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.12.5",
    "langgraph==1.0.6",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Conservative baseline: pycodestyle errors, pyflakes, and import sorting.
select = ["E", "F", "I"]
ignore = [
    "E501", # line length is handled by the formatter where it can be
]

[tool.ruff.lint.per-file-ignores]
# Tests set env vars before importing backend modules.
"tests/*" = ["E402"]
